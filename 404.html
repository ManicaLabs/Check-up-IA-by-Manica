<meta name="robots" content="noindex">
<title>Page introuvable — Check-up IA by Manica</title>
<meta name="theme-color" content="#F7F5F1">
<script>
  (() => {
    let choix = null;
    try { choix = localStorage.getItem('checkup-ia:theme'); } catch (e) { /* stockage bloqué */ }
    const theme = choix === 'dark' || choix === 'light' ? choix
      : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.dataset.theme = theme;
    document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#0B1326' : '#F7F5F1';
  })();
</script>
