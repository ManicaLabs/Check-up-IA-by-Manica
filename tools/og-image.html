<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<!-- Source de og-image.png (1200×630). Régénérer : voir docs/CDC.md, section « Assets ».
     Design system « Forêt et ambre » : fond clair, héros asymétrique (texte à gauche, visuel à droite
     dans la forme organique c-sunken), ambre réservé à l'action (« Faire le test »), Figtree. -->
<style>
@font-face {
  font-family: "Figtree";
  src: url("../fonts/figtree-latin.woff2") format("woff2");
  font-weight: 300 900;
}
html, body { margin: 0; }
body {
  width: 1200px;
  height: 630px;
  overflow: hidden;
  background-color: #f4f3ee;
  background-image:
    radial-gradient(44rem 26rem at 100% 0%, rgb(232 135 74 / .20), transparent 62%),
    radial-gradient(34rem 22rem at 0% 100%, rgb(31 74 62 / .10), transparent 60%);
  color: #2f433c;
  font-family: "Figtree", sans-serif;
  -webkit-font-smoothing: antialiased;
}
.card {
  box-sizing: border-box;
  width: 1200px;
  height: 630px;
  padding: 46px 48px 48px 68px;
  display: grid;
  grid-template-columns: 1fr 420px;
  column-gap: 36px;
}
.gauche { display: flex; flex-direction: column; min-width: 0; }
.logo { display: block; width: 180px; height: auto; }
.surtitre { margin: 26px 0 0; font-size: 23px; font-weight: 600; color: #56665f; }
.title {
  margin: 10px 0 0;
  font-size: 102px;
  font-weight: 700;
  letter-spacing: -0.035em;
  line-height: .95;
  color: #16302a;
  white-space: nowrap;
}
.pulse { display: block; width: 100%; height: auto; margin: 14px 0 0; overflow: visible; }
.lead {
  margin: 16px 0 0;
  font-size: 32px;
  font-weight: 700;
  line-height: 1.16;
  letter-spacing: -0.015em;
  color: #16302a;
}
.lead span { display: block; margin-top: 8px; font-size: 24px; font-weight: 400; color: #2f433c; letter-spacing: 0; }
.bas { margin-top: auto; display: flex; align-items: center; gap: 26px; }
.pill {
  padding: 17px 30px;
  border-radius: 14px;
  background: #e8874a;
  color: #16302a;
  font-size: 28px;
  font-weight: 700;
}
.url { font-size: 24px; font-weight: 600; color: #56665f; }

/* Forme organique : deux coins opposés à 160 px, les deux autres à 36 px ; mini carte de résultat (score fictif). */
.droite {
  align-self: stretch;
  display: grid;
  place-items: center;
  border-radius: 160px 36px 160px 36px;
  background-color: #e4ece5;
  background-image: radial-gradient(28rem 18rem at 100% 0%, rgb(232 135 74 / .22), transparent 62%);
}
.res {
  width: 340px;
  box-sizing: border-box;
  padding: 26px 28px 24px;
  border: 1px solid #d5ddd4;
  border-radius: 24px;
  background: #ffffff;
  box-shadow: 0 30px 60px -28px rgb(22 48 42 / .35);
}
.res-tete { display: flex; align-items: center; gap: 20px; }
.res-tete svg { flex: none; width: 108px; height: 108px; }
.res-label { font-size: 17px; font-weight: 600; color: #56665f; }
.res-niveau { margin-top: 4px; font-size: 28px; font-weight: 700; letter-spacing: -0.02em; color: #16302a; }
.axes { margin-top: 24px; display: grid; gap: 14px; }
.axe { display: grid; grid-template-columns: 108px 1fr; gap: 14px; align-items: center; font-size: 16px; font-weight: 600; color: #16302a; }
.piste { height: 9px; border-radius: 999px; background: #e4ece5; overflow: hidden; }
.piste i { display: block; height: 100%; border-radius: 999px; }
.ok { background: #1f6f43; }
.mid { background: #16302a; }
.ko { background: #8a4b08; }
.res-pied { margin-top: 20px; padding-top: 14px; border-top: 1px solid #d5ddd4; font-size: 16px; font-weight: 600; color: #56665f; }
</style>
</head>
<body>
<div class="card">
  <div class="gauche">
    <img class="logo" src="../img/logo-manica-300.png" alt="Manica">
    <p class="surtitre">Gratuit · 10 questions · 3 minutes</p>
    <h1 class="title">Check-up IA</h1>
    <svg class="pulse" viewBox="0 0 640 54" aria-hidden="true">
      <path d="M0 34 H236 C243 34 246 24 254 24 C262 24 265 34 272 34 H290 L298 40 L313 4 L330 50 L340 34 H364 C373 34 377 19 390 19 C403 19 407 34 416 34 H622" fill="none" stroke="#16302a" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="630" cy="34" r="7" fill="#e8874a"/>
    </svg>
    <p class="lead">Où en êtes-vous vraiment avec l’IA&#8239;?<span>10 questions adaptées à votre métier, un score sur 100.</span></p>
    <div class="bas">
      <span class="pill">Faire le test</span>
      <span class="url">checkup-ia.manica.fr</span>
    </div>
  </div>
  <div class="droite" aria-hidden="true">
    <div class="res">
      <div class="res-tete">
        <svg viewBox="0 0 116 116">
          <circle cx="58" cy="58" r="48" fill="none" stroke="#e4ece5" stroke-width="11"/>
          <circle cx="58" cy="58" r="48" fill="none" stroke="#e8874a" stroke-width="11" stroke-linecap="round" pathLength="100" stroke-dasharray="68 100" transform="rotate(-90 58 58)"/>
          <text x="58" y="69" text-anchor="middle" font-family="Figtree" font-size="34" font-weight="700" fill="#16302a">68</text>
        </svg>
        <div>
          <div class="res-label">Score sur 100</div>
          <div class="res-niveau">Pratiquant</div>
        </div>
      </div>
      <div class="axes">
        <div class="axe">Fondamentaux<span class="piste"><i class="ok" style="width:88%"></i></span></div>
        <div class="axe">Usages<span class="piste"><i class="mid" style="width:60%"></i></span></div>
        <div class="axe">Fiabilité<span class="piste"><i class="ko" style="width:24%"></i></span></div>
        <div class="axe">Données<span class="piste"><i class="ok" style="width:75%"></i></span></div>
        <div class="axe">Entreprise<span class="piste"><i class="mid" style="width:46%"></i></span></div>
      </div>
      <div class="res-pied">+ 3 priorités et le corrigé</div>
    </div>
  </div>
</div>
</body>
</html>
