<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<!-- Source de og-image.png (1200×630). Régénérer : voir docs/CDC.md, section « Assets ». -->
<style>
@font-face {
  font-family: "Manrope";
  src: url("../fonts/manrope-latin.woff2") format("woff2");
  font-weight: 400 800;
}
html, body { margin: 0; }
body {
  width: 1200px;
  height: 630px;
  overflow: hidden;
  background: #101B33;
  color: #F7F5F1;
  font-family: "Manrope", sans-serif;
  -webkit-font-smoothing: antialiased;
}
.card {
  position: relative;
  box-sizing: border-box;
  width: 1200px;
  height: 630px;
  padding: 64px 84px 68px;
  display: flex;
  flex-direction: column;
}
/* Logo sombre sur transparent, inversé pour ressortir sur le bleu nuit */
.logo { display: block; width: 430px; height: auto; filter: invert(1); }
.title {
  margin: 44px 0 0;
  font-size: 150px;
  font-weight: 800;
  letter-spacing: -0.05em;
  line-height: .9;
}
.pulse {
  position: absolute;
  left: 0;
  top: 402px;
  width: 1200px;
  height: 64px;
}
.bottom {
  margin-top: auto;
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 40px;
}
.lead {
  margin: 0;
  font-size: 42px;
  font-weight: 700;
  line-height: 1.18;
  letter-spacing: -0.02em;
}
.lead span { display: block; margin-top: 10px; font-size: 29px; font-weight: 500; color: #BCC5D6; letter-spacing: 0; }
.pill {
  flex: none;
  padding: 22px 34px;
  border-radius: 18px;
  background: #E8874A;
  color: #101B33;
  font-size: 32px;
  font-weight: 800;
  letter-spacing: -0.01em;
}
</style>
</head>
<body>
<div class="card">
  <img class="logo" src="../img/logo-manica-baseline-900.png" alt="Manica">
  <h1 class="title">Check-up IA</h1>
  <svg class="pulse" viewBox="0 0 1200 64" aria-hidden="true">
    <path d="M0 40 H912 C920 40 923 28 932 28 C941 28 944 40 952 40 H972 L981 47 L998 4 L1018 60 L1030 40 H1056 C1066 40 1070 23 1084 23 C1098 23 1102 40 1112 40 H1200" fill="none" stroke="#F7F5F1" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity=".9"/>
  </svg>
  <div class="bottom">
    <p class="lead">Où en êtes-vous vraiment avec l’IA&#8239;?<span>20 questions, 5 minutes, un score sur 100.</span></p>
    <span class="pill">Faire le test</span>
  </div>
</div>
</body>
</html>
